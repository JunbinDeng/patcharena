[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patcharena"
version = "0.1.0"
description = "Minimal benchmarking tool for coding agents."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
patcharena = "patcharena.cli:main"

[tool.setuptools.packages.find]
include = ["patcharena*"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["patcharena"]
